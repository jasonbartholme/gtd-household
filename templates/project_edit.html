{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <h1 class="mb-4">{{ page_title }}: {{ project.name }}</h1>

    <div class="card">
        <div class="card-body">
            <form action="{{ url_for('edit_project', id=project.id) }}" method="POST">
                <div class="mb-3">
                    <label for="name" class="form-label">Project Name</label>
                    <input type="text" class="form-control" id="name" name="name" value="{{ project.name }}" required>
                </div>
                <div class="mb-3">
                    <label for="description" class="form-label">Description</label>
                    <textarea class="form-control" id="description" name="description" rows="5">{{ project.description or '' }}</textarea>
                </div>
                <div class="mb-3">
                    <label for="asset_id" class="form-label">Related Asset (Optional)</label>
                    <select class="form-select" id="asset_id" name="asset_id">
                        <option value="">None</option>
                        {% for asset in all_assets %}
                        <option value="{{ asset.id }}" {% if project.asset_id == asset.id %}selected{% endif %}>{{ asset.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <a href="{{ url_for('project_detail', id=project.id) }}" class="btn btn-secondary">Cancel</a>
                <button type="submit" class="btn btn-primary">Save Changes</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
