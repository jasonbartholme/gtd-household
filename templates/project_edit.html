{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <h1 class="mb-4">{{ page_title }}: {{ project.name }}</h1>

    <div class="card">
        <div class="card-body">
            <form action="{{ url_for('edit_project', id=project.id) }}" method="POST" enctype="multipart/form-data">
                <div class="mb-3">
                    <label for="name" class="form-label">Project Name</label>
                    <input type="text" class="form-control" id="name" name="name" value="{{ project.name }}" required>
                </div>
                <div class="mb-3">
                    <label for="description" class="form-label">Description</label>
                    <textarea class="form-control" id="description" name="description" rows="5">{{ project.description or '' }}</textarea>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="estimated_cost" class="form-label">Estimated Cost (Optional)</label>
                        <input type="number" step="0.01" class="form-control" id="estimated_cost" name="estimated_cost" value="{{ project.estimated_cost if project.estimated_cost is not none else '' }}">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="due_date" class="form-label">Estimated Due Date (Optional)</label>
                        <input type="date" class="form-control" id="due_date" name="due_date" value="{{ project.due_date.strftime('%Y-%m-%d') if project.due_date else '' }}">
                    </div>
                </div>

                <div class="mb-3">
                    <label for="image" class="form-label">Upload Image</label>
                    <input type="file" class="form-control" id="image" name="image" accept="image/*">
                    <input type="text" class="form-control mt-2" id="image_description" name="image_description" placeholder="Image description (required if uploading)" required>
                </div>

                <div class="mb-3">
                    <label for="asset_id" class="form-label">Related Asset (Optional)</label>
                    <select class="form-select" id="asset_id" name="asset_id">
                        <option value="">None</option>
                        {% for asset in all_assets %}
                        <option value="{{ asset.id }}" {% if project.asset_id == asset.id %}selected{% endif %}>{{ asset.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="mb-3">
                    <label for="supplies" class="form-label">Supplies Used</label>
                    <select class="form-select" id="supplies" name="supplies" multiple size="5">
                        {% set selected_supply_ids = project.supplies | map(attribute='id') | list %}
                        {% for supply in all_supplies %}
                        <option value="{{ supply.id }}" {% if supply.id in selected_supply_ids %}selected{% endif %}>{{ supply.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <a href="{{ url_for('project_detail', id=project.id) }}" class="btn btn-secondary">Cancel</a>
                <button type="submit" class="btn btn-primary">Save Changes</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
