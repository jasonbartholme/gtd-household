{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="mb-0">{{ page_title }}</h1>
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addAssetModal">+ Add Asset</button>
    </div>

    <div class="row g-3">
        {% for asset in assets %}
        <div class="col-md-4">
            <div class="card h-100">
                <div class="card-body">
                    <h5 class="card-title"><a href="{{ url_for('asset_detail', id=asset.id) }}">{{ asset.name }}</a></h5>
                    <h6 class="card-subtitle mb-2 text-muted">{{ asset.category or 'Uncategorized' }}</h6>
                </div>
            </div>
        </div>
        {% else %}
        <div class="col-12 text-center py-5">
            <h5 class="text-muted">No assets found.</h5>
        </div>
        {% endfor %}
    </div>
</div>

<!-- Add Asset Modal -->
<div class="modal fade" id="addAssetModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <form action="{{ url_for('add_asset') }}" method="POST" enctype="multipart/form-data">
                <div class="modal-header">
                    <h5 class="modal-title">Add New Asset</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="row">
                        <div class="col-md-8 mb-3">
                            <label class="form-label">Asset Name</label>
                            <input type="text" name="name" class="form-control" required>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Brand</label>
                            <input type="text" name="brand" class="form-control">
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Category</label>
                            <input type="text" name="category" class="form-control">
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Condition</label>
                            <select name="condition" class="form-select">
                                <option value="New" selected>New</option>
                                <option value="Used">Used</option>
                                <option value="For Parts">For Parts</option>
                            </select>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Estimated Value ($)</label>
                            <input type="number" step="0.01" name="estimated_value" class="form-control">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Notes</label>
                        <textarea name="notes" class="form-control" rows="3"></textarea>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Purchase Link</label>
                            <input type="url" name="purchase_url" class="form-control">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Support/Manual Link</label>
                            <input type="url" name="manual_url" class="form-control">
                        </div>
                    </div>
                    <hr>
                    <div class="row">
                        <div class="col-md-8 mb-3">
                            <label class="form-label">Image</label>
                            <input type="file" name="image" class="form-control">
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Offer Price ($)</label>
                            <input type="number" step="0.01" name="offer_price" class="form-control">
                        </div>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" name="is_for_sale" id="is_for_sale_add">
                        <label class="form-check-label" for="is_for_sale_add">This item is for sale</label>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary">Add Asset</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
