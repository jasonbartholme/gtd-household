{% extends "base.html" %}

{% block content %}
<div class="container mt-4">
    <h1 class="mb-4">Edit Asset: {{ asset.name }}</h1>

    <div class="card">
        <div class="card-body">
            <form action="{{ url_for('edit_asset', id=asset.id) }}" method="POST" enctype="multipart/form-data">
                <div class="row">
                    <div class="col-md-8 mb-3">
                        <label for="name" class="form-label">Asset Name</label>
                        <input type="text" class="form-control" id="name" name="name" value="{{ asset.name }}" required>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label for="brand" class="form-label">Brand</label>
                        <input type="text" class="form-control" id="brand" name="brand" value="{{ asset.brand or '' }}">
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-4 mb-3">
                        <label for="category" class="form-label">Category</label>
                        <input type="text" class="form-control" id="category" name="category" value="{{ asset.category or '' }}">
                    </div>
                    <div class="col-md-4 mb-3">
                        <label for="condition" class="form-label">Condition</label>
                        <select class="form-select" id="condition" name="condition">
                            <option value="" {% if not asset.condition %}selected{% endif %}>Not Set</option>
                            <option value="New" {% if asset.condition == 'New' %}selected{% endif %}>New</option>
                            <option value="Used" {% if asset.condition == 'Used' %}selected{% endif %}>Used</option>
                            <option value="For Parts" {% if asset.condition == 'For Parts' %}selected{% endif %}>For Parts</option>
                        </select>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label for="estimated_value" class="form-label">Estimated Value ($)</label>
                        <input type="number" step="0.01" class="form-control" id="estimated_value" name="estimated_value" value="{{ asset.estimated_value or '' }}">
                    </div>
                </div>
                <div class="mb-3">
                    <label for="context" class="form-label">Location</label>
                    <input type="text" class="form-control" id="context" name="context" value="{{ asset.context or '' }}" placeholder="e.g., Garage, Office Closet">
                </div>
                <div class="mb-3">
                    <label for="notes" class="form-label">Notes</label>
                    <textarea class="form-control" id="notes" name="notes" rows="3">{{ asset.notes or '' }}</textarea>
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="purchase_url" class="form-label">Purchase Link</label>
                        <input type="url" class="form-control" id="purchase_url" name="purchase_url" value="{{ asset.purchase_url or '' }}">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="manual_url" class="form-label">Support/Manual Link</label>
                        <input type="url" class="form-control" id="manual_url" name="manual_url" value="{{ asset.manual_url or '' }}">
                    </div>
                </div>
                <hr>
                <div class="row">
                    <div class="col-md-8 mb-3">
                        <label for="image" class="form-label">Upload New Image</label>
                        <input type="file" class="form-control" id="image" name="image">
                        {% if asset.image_filename %}<div class="form-text">Current image: {{ asset.image_filename }}</div>{% endif %}
                    </div>
                    <div class="col-md-4 mb-3">
                        <label for="offer_price" class="form-label">Offer Price ($)</label>
                        <input type="number" step="0.01" class="form-control" id="offer_price" name="offer_price" value="{{ asset.offer_price or '' }}">
                    </div>
                </div>
                <div class="form-check mb-3">
                    <input class="form-check-input" type="checkbox" id="is_for_sale" name="is_for_sale" {% if asset.is_for_sale %}checked{% endif %}>
                    <label class="form-check-label" for="is_for_sale">This item is for sale</label>
                </div>

                <div class="mt-4">
                    <a href="{{ url_for('asset_detail', id=asset.id) }}" class="btn btn-secondary">Cancel</a>
                    <button type="submit" class="btn btn-primary">Save Changes</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
